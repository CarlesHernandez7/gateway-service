server:
  port: 8090

spring:
  application:
    name: gateway-service

  config:
    import: optional:file:.env[.properties]

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/user/**, /api/roles/**, /auth/**
              filters:
                - StripPrefix=0

            # Future services - uncomment when ready
            # - id: payment-service
            #   uri: ${PAYMENT_SERVICE_URL:http://localhost:8081}
            #   predicates:
            #     - Path=/api/payments/**
            #   filters:
            #     - StripPrefix=0

            # - id: agenda-service
            #   uri: ${AGENDA_SERVICE_URL:http://localhost:8082}
            #   predicates:
            #     - Path=/api/agenda/**
            #   filters:
            #     - StripPrefix=0

application:
  version: "@project.version@"
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
    internal-api-key: ${INTERNAL_API_KEY}
    open-endpoints: /auth/**
